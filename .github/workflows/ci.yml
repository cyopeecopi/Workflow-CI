name: MLflow CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  train_and_build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install MLflow & Dependencies
      run: |
        pip install mlflow scikit-learn pandas

    - name: Run MLflow Project
      run: |
        cd MLProject
        mlflow run . --env-manager=local
        
    - name: Save Artifacts (GitHub Storage)
      uses: actions/upload-artifact@v4
      with:
        name: trained-model-artifacts
        path: MLProject/saved_model/

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        cd MLProject
        mlflow models build-docker -m saved_model -n ${{ secrets.DOCKER_USERNAME }}/wine-model:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/wine-model:latest