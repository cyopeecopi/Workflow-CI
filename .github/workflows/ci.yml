name: Automated ML CI Pipeline

on:
  push:
    paths:
      - 'MLProject/**'
  workflow_dispatch:

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas scikit-learn mlflow

      - name: Jalankan Eksperimen dengan MLProject
        run: |
          cd MLProject
          # Menjalankan Kriteria 3 (MLProject)
          mlflow run . --env-manager=local

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build dan Push Docker Image (Syarat Advance Kriteria 3)
        run: |
          cd MLProject
          # MLflow akan membungkus model menjadi image API FastAPI bawaannya
          mlflow models build-docker -m saved_model -n ${{ secrets.DOCKERHUB_USERNAME }}/breast-cancer-model:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/breast-cancer-model:latest

      - name: Simpan Artefak ke GitHub Repo (Syarat Advance Kriteria 3)
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add MLProject/saved_model/
          git commit -m "Auto-upload artefak model MLProject" || echo "No changes to commit"
          git push